<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行 Agent 测试台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    background: #ededed;
  }
  header {
    padding: 14px 20px; background: #2e2e2e; color: #fff;
    font-size: 16px; font-weight: 600; flex-shrink: 0;
  }
  header small { font-weight: 400; color: #aaa; margin-left: 10px; font-size: 12px; }
  /* 认证栏：未登录时显示输入框和按钮，登录后折叠成一行状态 */
  #authBar {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: #f7f7f7; border-bottom: 1px solid #ddd;
  }
  #who { font-size: 14px; font-weight: 600; color: #077c46; margin-right: 4px; }
  #authBar input {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; background: #fff; outline: none;
  }
  #authUser { width: 130px; }
  #authPass { width: 130px; }
  #authBar button {
    padding: 8px 16px; border: none; border-radius: 6px;
    background: #07c160; color: #fff; font-size: 14px; cursor: pointer;
  }
  #authBar button:disabled { background: #a0d8b8; cursor: not-allowed; }
  #btnRegister { background: #fff; color: #07c160; border: 1px solid #07c160; }
  #btnRegister:disabled { background: #f2f2f2; color: #a0d8b8; border-color: #a0d8b8; }
  #btnLogout { background: #e64340; }
  #authMsg { font-size: 13px; color: #666; margin-left: 4px; }
  #authMsg.error { color: #b00020; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 8px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    position: relative;
  }
  .row.user .bubble { background: #95ec69; color: #111; }
  .row.ai .bubble { background: #fff; color: #111; }
  .bubble.error { background: #ffe0e0; color: #b00020; }
  /* AI 气泡还没收到第一个字时的占位动画 */
  .bubble.waiting::after {
    content: "思考中…"; color: #999;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
  footer {
    flex-shrink: 0; display: flex; gap: 10px;
    padding: 12px 16px; background: #f7f7f7; border-top: 1px solid #ddd;
  }
  #msg {
    flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 15px; outline: none;
  }
  #msg:focus { border-color: #07c160; }
  #send {
    padding: 10px 24px; border: none; border-radius: 6px;
    background: #07c160; color: #fff; font-size: 15px; cursor: pointer;
  }
  #send:disabled { background: #a0d8b8; cursor: not-allowed; }
</style>
</head>
<body>
<header>旅行 Agent · 流式对话测试台<small>换账号 = 登出后重新登录，不同账号有独立会话记忆</small></header>
<div id="authBar">
  <span id="who"></span>
  <input id="authUser" placeholder="user_id" autocomplete="off">
  <input id="authPass" type="password" placeholder="密码">
  <button id="btnRegister">注册</button>
  <button id="btnLogin">登录</button>
  <button id="btnLogout" style="display:none">登出</button>
  <span id="authMsg"></span>
</div>
<main id="chat"></main>
<footer>
  <input id="msg" placeholder="先登录，然后输入消息，Enter 发送" autocomplete="off" disabled>
  <button id="send" disabled>发送</button>
</footer>

<script>
const BASE = "http://127.0.0.1:8000";
// 聊天路径含中文，直接写百分号编码形式（/agent/旅行agent/），避免任何文件编码问题
const API = {
  chat:     BASE + "/agent/%E6%97%85%E8%A1%8Cagent/",
  logout:   BASE + "/agent/Logout/",
  login:    BASE + "/Login/",
  register: BASE + "/Register/",
};

// 登录态持久化：刷新页面不丢
let token = localStorage.getItem("travel_agent_token") || "";
let uid   = localStorage.getItem("travel_agent_uid") || "";

const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const who = document.getElementById("who");
const authUser = document.getElementById("authUser");
const authPass = document.getElementById("authPass");
const btnRegister = document.getElementById("btnRegister");
const btnLogin = document.getElementById("btnLogin");
const btnLogout = document.getElementById("btnLogout");
const authMsg = document.getElementById("authMsg");

let busy = false;

function showAuthMsg(text, isError) {
  authMsg.textContent = text;
  authMsg.classList.toggle("error", !!isError);
}

// 登录态切换：登录后隐藏输入框、点亮聊天框；登出反之
function setAuthUI(loggedIn) {
  who.textContent = loggedIn ? "已登录：" + uid : "";
  authUser.style.display = loggedIn ? "none" : "";
  authPass.style.display = loggedIn ? "none" : "";
  btnRegister.style.display = loggedIn ? "none" : "";
  btnLogin.style.display = loggedIn ? "none" : "";
  btnLogout.style.display = loggedIn ? "" : "none";
  msgInput.disabled = !loggedIn;
  sendBtn.disabled = !loggedIn;
  msgInput.placeholder = loggedIn ? "输入消息，Enter 发送" : "先登录，然后输入消息，Enter 发送";
}

// 统一请求封装：非 2xx 时把 FastAPI 的 {detail} 提出来当错误信息
async function postJSON(url, body, withAuth) {
  const headers = { "Content-Type": "application/json" };
  if (withAuth) {
    headers["Authorization"] = "Bearer " + token;
    headers["user_id"] = uid;
  }
  const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error(data && data.detail ? data.detail : "HTTP " + res.status);
    err.status = res.status;
    throw err;
  }
  return data;
}

function logoutLocal() {
  token = "";
  localStorage.removeItem("travel_agent_token");
  setAuthUI(false);
}

async function doAuth(kind) {
  const u = authUser.value.trim();
  const p = authPass.value;
  if (!u || !p) { showAuthMsg("user_id 和密码都要填", true); return; }
  btnRegister.disabled = btnLogin.disabled = true;
  try {
    // 注册/登录成功都返回 [user_id, token] 数组
    const data = await postJSON(kind === "register" ? API.register : API.login,
                                { user_id: u, password: p }, false);
    uid = data[0];
    token = data[1];
    localStorage.setItem("travel_agent_uid", uid);
    localStorage.setItem("travel_agent_token", token);
    setAuthUI(true);
    showAuthMsg(kind === "register" ? "注册成功，已自动登录" : "登录成功");
    msgInput.focus();
  } catch (e) {
    showAuthMsg(e.message, true);
  } finally {
    btnRegister.disabled = btnLogin.disabled = false;
  }
}

async function doLogout() {
  try {
    await postJSON(API.logout, {}, true);
    showAuthMsg("已登出");
  } catch (e) {
    // 令牌已失效（401）也视为登出成功，本地状态照样清
    showAuthMsg(e.status === 401 ? "令牌已失效，已登出" : "登出失败：" + e.message, true);
  }
  logoutLocal();
}

function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function send() {
  const message = msgInput.value.trim();
  if (!message || busy) return;

  busy = true;
  sendBtn.disabled = true;
  msgInput.value = "";

  addBubble("user", message);
  // 关键防阶梯设计：AI 气泡元素整轮只创建这一个，
  // 之后每个 chunk 只更新它的 textContent，绝不按 chunk 新建节点
  const aiEl = addBubble("ai", "");
  aiEl.classList.add("waiting");

  let aiText = "";
  try {
    const res = await fetch(API.chat, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
        "user_id": uid,
      },
      body: JSON.stringify({ message: message }),
    });
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      const err = new Error(detail);
      err.status = res.status;
      throw err;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      aiEl.classList.remove("waiting");
      // stream:true 保证跨 chunk 截断的多字节汉字不会变乱码
      aiText += decoder.decode(value, { stream: true });
      aiEl.textContent = aiText;
      chat.scrollTop = chat.scrollHeight;
    }
    aiText += decoder.decode(); // 冲刷解码器里残余的字节
    aiEl.textContent = aiText || "[后端返回了空内容]";
  } catch (e) {
    aiEl.classList.remove("waiting");
    aiEl.classList.add("error");
    aiEl.textContent = (aiText ? aiText + "\n\n" : "") + "[请求失败] " + e.message;
    // 令牌过期/被顶下线：清本地状态，回登录界面
    if (e.status === 401) {
      logoutLocal();
      showAuthMsg("登录已过期，请重新登录", true);
    }
  } finally {
    busy = false;
    sendBtn.disabled = !token;
    msgInput.focus();
  }
}

btnRegister.addEventListener("click", () => doAuth("register"));
btnLogin.addEventListener("click", () => doAuth("login"));
authPass.addEventListener("keydown", (e) => {
  if (e.key === "Enter") doAuth("login");
});
btnLogout.addEventListener("click", doLogout);
sendBtn.addEventListener("click", send);
msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

// 启动时恢复上次登录态（token 存在即视为已登录，失效了第一次请求会被 401 打回登录界面）
setAuthUI(!!(token && uid));
msgInput.focus();
</script>
</body>
</html>
