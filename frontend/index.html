<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行 Agent 测试台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    background: #ededed;
  }
  header {
    padding: 14px 20px; background: #2e2e2e; color: #fff;
    font-size: 16px; font-weight: 600; flex-shrink: 0;
  }
  header small { font-weight: 400; color: #aaa; margin-left: 10px; font-size: 12px; }
  /* 认证栏：未登录时显示输入框和按钮，登录后折叠成一行状态 */
  #authBar {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: #f7f7f7; border-bottom: 1px solid #ddd;
  }
  #who { font-size: 14px; font-weight: 600; color: #077c46; margin-right: 4px; }
  #authBar input {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; background: #fff; outline: none;
  }
  #authUser { width: 130px; }
  #authPass { width: 130px; }
  #authBar button {
    padding: 8px 16px; border: none; border-radius: 6px;
    background: #07c160; color: #fff; font-size: 14px; cursor: pointer;
  }
  #authBar button:disabled { background: #a0d8b8; cursor: not-allowed; }
  #btnRegister { background: #fff; color: #07c160; border: 1px solid #07c160; }
  #btnRegister:disabled { background: #f2f2f2; color: #a0d8b8; border-color: #a0d8b8; }
  #btnLogout { background: #e64340; }
  #authMsg { font-size: 13px; color: #666; margin-left: 4px; }
  #authMsg.error { color: #b00020; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 8px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    position: relative;
  }
  .row.user .bubble { background: #95ec69; color: #111; }
  .row.ai .bubble { background: #fff; color: #111; }
  .bubble.error { background: #ffe0e0; color: #b00020; }
  /* AI 气泡还没收到第一个字时的占位动画 */
  .bubble.waiting::after {
    content: "思考中…"; color: #999;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
  footer {
    flex-shrink: 0; display: flex; gap: 10px;
    padding: 12px 16px; background: #f7f7f7; border-top: 1px solid #ddd;
  }
  #msg {
    flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 15px; outline: none;
  }
  #msg:focus { border-color: #07c160; }
  #send {
    padding: 10px 24px; border: none; border-radius: 6px;
    background: #07c160; color: #fff; font-size: 15px; cursor: pointer;
  }
  #send:disabled { background: #a0d8b8; cursor: not-allowed; }
  /* 计划表卡片：出现在本轮文本之后，比普通气泡更宽 */
  .row.plan {
    justify-content: flex-start; flex-direction: column;
    align-items: flex-start; gap: 10px;
  }
  /* 价格免责提示：计划卡上方的醒目条 */
  .price-notice {
    width: min(720px, 88%);
    padding: 12px 16px;
    border-radius: 10px;
    background: #fff3cd;
    border: 1px solid #f0b429;
    border-left: 6px solid #e6a23c;
    color: #8a5300;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .5px;
    box-shadow: 0 4px 12px rgba(230, 162, 60, .18);
  }
  .plan-card {
    width: min(720px, 88%); background: #fff; border: 1px solid #e3e3e3;
    border-radius: 14px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.08);
    animation: planIn .3s ease-out;
  }
  @keyframes planIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .plan-head {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 14px;
    padding: 16px 18px; color: #fff;
    background: linear-gradient(135deg, #08a85a, #067a42);
  }
  .plan-city { font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  .plan-sub { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,.82); }
  .plan-total { text-align: right; white-space: nowrap; }
  .plan-total span { display: block; font-size: 12px; color: rgba(255,255,255,.82); }
  .plan-total strong { font-size: 25px; line-height: 1.15; }
  .plan-days { padding: 2px 18px; }
  .plan-day { padding: 14px 0; border-bottom: 1px dashed #e7e7e7; }
  .plan-day:last-child { border-bottom: none; }
  .day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .day-badge {
    padding: 2px 8px; border-radius: 999px; background: #e8f7ee;
    color: #077c46; font-size: 12px; font-weight: 700;
  }
  .day-title { font-size: 15px; font-weight: 700; color: #222; }
  .day-cost { margin-left: auto; color: #077c46; font-size: 13px; font-weight: 600; }
  .activity { display: flex; gap: 10px; padding: 7px 0; }
  .slot {
    flex: 0 0 44px; height: 24px; line-height: 24px; text-align: center;
    border-radius: 6px; background: #eef4ff; color: #3563c4;
    font-size: 12px; font-weight: 600;
  }
  .slot.slot-pm { background: #fff4e6; color: #b26a00; }
  .slot.slot-night { background: #f3ecff; color: #6b46c1; }
  .slot.slot-home { background: #e9f8f0; color: #077c46; }
  .activity-main { flex: 1; min-width: 0; }
  .place { font-size: 14px; font-weight: 600; color: #222; }
  .meta, .note { margin-top: 3px; font-size: 12px; line-height: 1.55; }
  .meta { color: #777; }
  .note { color: #999; }
  .plan-foot {
    padding: 12px 18px 15px; border-top: 1px solid #eee; background: #fafafa;
    color: #666; font-size: 12px; line-height: 1.6;
  }
  @media (max-width: 640px) {
    .plan-card { width: 94%; }
    .price-notice { width: 94%; font-size: 15px; }
    .plan-head { padding: 14px; }
    .plan-city { font-size: 18px; }
    .plan-total strong { font-size: 21px; }
  }
</style>
</head>
<body>
<header>旅行 Agent · 流式对话测试台<small>换账号 = 登出后重新登录，不同账号有独立会话记忆</small></header>
<div id="authBar">
  <span id="who"></span>
  <input id="authUser" placeholder="user_id" autocomplete="off">
  <input id="authPass" type="password" placeholder="密码">
  <button id="btnRegister">注册</button>
  <button id="btnLogin">登录</button>
  <button id="btnLogout" style="display:none">登出</button>
  <span id="authMsg"></span>
</div>
<main id="chat"></main>
<footer>
  <input id="msg" placeholder="先登录，然后输入消息，Enter 发送" autocomplete="off" disabled>
  <button id="send" disabled>发送</button>
</footer>

<script>
const BASE = "";
// 与后端 agent.py 中的 PLAN_CARD_MARKER 保持一致
const PLAN_CARD_MARKER = "\n\n[[PLAN_CARD]]\n";
// 聊天路径含中文，直接写百分号编码形式（/agent/旅行agent/），避免任何文件编码问题
const API = {
  chat:     BASE + "/agent/%E6%97%85%E8%A1%8Cagent/",
  logout:   BASE + "/agent/Logout/",
  login:    BASE + "/Login/",
  register: BASE + "/Register/",
};

// 登录态持久化：刷新页面不丢
let token = localStorage.getItem("travel_agent_token") || "";
let uid   = localStorage.getItem("travel_agent_uid") || "";

const chat = document.getElementById("chat");
const msgInput = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const who = document.getElementById("who");
const authUser = document.getElementById("authUser");
const authPass = document.getElementById("authPass");
const btnRegister = document.getElementById("btnRegister");
const btnLogin = document.getElementById("btnLogin");
const btnLogout = document.getElementById("btnLogout");
const authMsg = document.getElementById("authMsg");

let busy = false;
let inFlight = null; // 当前聊天请求的 AbortController，登出/切号时用于中止

function showAuthMsg(text, isError) {
  authMsg.textContent = text;
  authMsg.classList.toggle("error", !!isError);
}

// 登录态切换：登录后隐藏输入框、点亮聊天框；登出反之
function setAuthUI(loggedIn) {
  who.textContent = loggedIn ? "已登录：" + uid : "";
  authUser.style.display = loggedIn ? "none" : "";
  authPass.style.display = loggedIn ? "none" : "";
  btnRegister.style.display = loggedIn ? "none" : "";
  btnLogin.style.display = loggedIn ? "none" : "";
  btnLogout.style.display = loggedIn ? "" : "none";
  msgInput.disabled = !loggedIn;
  sendBtn.disabled = !loggedIn;
  msgInput.placeholder = loggedIn ? "输入消息，Enter 发送" : "先登录，然后输入消息，Enter 发送";
}

function formatApiError(detail, status) {
  if (typeof detail === "string" && detail) return detail;
  if (!Array.isArray(detail) || !detail.length) return "HTTP " + status;

  const fields = { user_id: "用户名", password: "密码", message: "消息" };
  return detail.map(error => {
    const field = fields[error.loc?.at(-1)] || "请求参数";
    switch (error.type) {
      case "string_too_short":
        return field + "至少需要 " + error.ctx.min_length + " 个字符";
      case "string_too_long":
        return field + "最多允许 " + error.ctx.max_length + " 个字符";
      case "missing":
        return field + "不能为空";
      case "string_type":
        return field + "必须是文本";
      case "json_invalid":
        return "请求数据格式错误，请刷新页面后重试";
      default:
        return field + "格式不正确（" + error.type + "）";
    }
  }).join("；");
}

// 统一请求封装：非 2xx 时把 FastAPI 的 {detail} 提出来当错误信息
async function postJSON(url, body, withAuth) {
  const headers = { "Content-Type": "application/json" };
  if (withAuth) {
    headers["Authorization"] = "Bearer " + token;
    headers["user_id"] = uid;
  }
  const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error(formatApiError(data?.detail, res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

// 中止正在进行的聊天请求：避免登出/切号后旧账号的流继续渲染、后端继续空跑
function abortInFlight() {
  if (inFlight) {
    inFlight.abort();
    inFlight = null;
  }
}

function logoutLocal() {
  abortInFlight();
  // 聊天区是设备本地的，切换账号必须清空，否则 B 会看到 A 的对话
  chat.innerHTML = "";
  busy = false;
  token = "";
  uid = "";
  localStorage.removeItem("travel_agent_token");
  localStorage.removeItem("travel_agent_uid");
  setAuthUI(false);
}

async function doAuth(kind) {
  const u = authUser.value.trim();
  const p = authPass.value;
  if (!u || !p) { showAuthMsg("user_id 和密码都要填", true); return; }
  btnRegister.disabled = btnLogin.disabled = true;
  try {
    // 注册/登录成功都返回 [user_id, token] 数组
    const data = await postJSON(kind === "register" ? API.register : API.login,
                                { user_id: u, password: p }, false);
    // 账号确实变了才清空聊天区，同账号重新登录不丢记录
    if (data[0] !== uid) chat.innerHTML = "";
    uid = data[0];
    token = data[1];
    localStorage.setItem("travel_agent_uid", uid);
    localStorage.setItem("travel_agent_token", token);
    setAuthUI(true);
    showAuthMsg(kind === "register" ? "注册成功，已自动登录" : "登录成功");
    msgInput.focus();
  } catch (e) {
    showAuthMsg(e.message, true);
  } finally {
    btnRegister.disabled = btnLogin.disabled = false;
  }
}

async function doLogout() {
  try {
    await postJSON(API.logout, {}, true);
    showAuthMsg("已登出");
  } catch (e) {
    // 令牌已失效（401）也视为登出成功，本地状态照样清
    showAuthMsg(e.status === 401 ? "令牌已失效，已登出" : "登出失败：" + e.message, true);
  }
  logoutLocal();
}

function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function makeEl(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function formatMoney(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return String(value ?? "");
  return "¥" + n.toFixed(2).replace(/\.00$/, "");
}

// 后端发来的 markdown 字段实际是工具生成的 JSON 字符串，这里做两层解析
function parsePlanPayload(raw) {
  const event = JSON.parse(raw);
  let plan = event && event.render_type === "plan_card" ? event.markdown : event;
  if (typeof plan === "string") plan = JSON.parse(plan);
  if (!plan || !Array.isArray(plan.days)) throw new Error("计划表格式不正确");
  return plan;
}

function addPlanCard(plan) {
  const days = plan.days.slice().sort((a, b) =>
    (Number(a.day_index) || 0) - (Number(b.day_index) || 0));
  const total = plan.cost != null
    ? plan.cost
    : days.reduce((sum, d) => sum + Number(d.day_cost || 0), 0);

  const row = makeEl("div", "row plan");
  const card = makeEl("div", "plan-card");

  const head = makeEl("div", "plan-head");
  const headLeft = makeEl("div");
  headLeft.appendChild(makeEl("div", "plan-city", plan.city || "旅行计划"));
  headLeft.appendChild(makeEl("div", "plan-sub", days.length + " 天行程 · 已保存到工作台"));
  const headTotal = makeEl("div", "plan-total");
  headTotal.appendChild(makeEl("span", "", "总费用（不含住宿）"));
  headTotal.appendChild(makeEl("strong", "", formatMoney(total)));
  head.appendChild(headLeft);
  head.appendChild(headTotal);
  card.appendChild(head);

  const body = makeEl("div", "plan-days");
  days.forEach((day) => {
    const section = makeEl("div", "plan-day");
    const dayHead = makeEl("div", "day-head");
    dayHead.appendChild(makeEl("span", "day-badge", "D" + (day.day_index ?? "")));
    dayHead.appendChild(makeEl("span", "day-title", "第 " + (day.day_index ?? "?") + " 天"));
    dayHead.appendChild(makeEl("span", "day-cost", formatMoney(day.day_cost)));
    section.appendChild(dayHead);

    (day.activities || []).forEach((act) => {
      const item = makeEl("div", "activity");
      const slot = makeEl("span", "slot", act.time_slot || "");
      if (act.time_slot === "下午") slot.classList.add("slot-pm");
      if (act.time_slot === "晚上") slot.classList.add("slot-night");
      item.appendChild(slot);

      const main = makeEl("div", "activity-main");
      main.appendChild(makeEl("div", "place", act.place || "未命名景点"));
      const costs = [];
      if (Number(act.place_cost)) costs.push("门票 " + formatMoney(act.place_cost));
      if (Number(act.meal_cost)) costs.push("餐饮 " + formatMoney(act.meal_cost));
      if (Number(act.transport_cost)) costs.push("交通 " + formatMoney(act.transport_cost));
      const metaParts = [];
      if (act.meal && act.meal !== "无") metaParts.push("用餐：" + act.meal);
      metaParts.push(costs.length ? costs.join(" · ") : "无额外费用");
      main.appendChild(makeEl("div", "meta", metaParts.join(" · ")));
      if (act.note && act.note !== "无") main.appendChild(makeEl("div", "note", "备注：" + act.note));
      item.appendChild(main);
      section.appendChild(item);
    });

    const hasHome = day.home && day.home !== "无";
    if (hasHome) {
      const item = makeEl("div", "activity");
      item.appendChild(makeEl("span", "slot slot-home", "住宿"));
      const main = makeEl("div", "activity-main");
      main.appendChild(makeEl("div", "place", day.home));
      main.appendChild(makeEl("div", "meta", "住宿费用需自行预订，未计入本表总价"));
      item.appendChild(main);
      section.appendChild(item);
    }
    body.appendChild(section);
  });
  card.appendChild(body);

  if (plan.remarks && plan.remarks !== "无") {
    card.appendChild(makeEl("div", "plan-foot", "整体备注：" + plan.remarks));
  }
  row.appendChild(makeEl("div", "price-notice", "实际价格以现场为准"));
  row.appendChild(card);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const message = msgInput.value.trim();
  if (!message || busy) return;

  busy = true;
  sendBtn.disabled = true;
  msgInput.value = "";

  const controller = new AbortController();
  inFlight = controller;

  addBubble("user", message);
  // 关键防阶梯设计：AI 气泡元素整轮只创建这一个，
  // 之后每个 chunk 只更新它的 textContent，绝不按 chunk 新建节点
  const aiEl = addBubble("ai", "");
  aiEl.classList.add("waiting");

  let aiText = "";
  let cardRaw = null;
  // 文本正常流式显示；一旦遇到计划表标记，后续字节全部归入卡片 JSON
  const consume = (piece) => {
    if (cardRaw !== null) {
      cardRaw += piece;
      return;
    }
    aiText += piece;
    const at = aiText.indexOf(PLAN_CARD_MARKER);
    if (at === -1) {
      aiEl.textContent = aiText;
      return;
    }
    cardRaw = aiText.slice(at + PLAN_CARD_MARKER.length);
    aiText = aiText.slice(0, at).replace(/\s+$/, "");
    aiEl.textContent = aiText || "计划表生成中…";
  };

  try {
    const res = await fetch(API.chat, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
        "user_id": uid,
      },
      body: JSON.stringify({ message: message }),
      signal: controller.signal,
    });
    if (!res.ok) {
      let data = null;
      try { data = await res.json(); } catch (_) {}
      const err = new Error(formatApiError(data?.detail, res.status));
      err.status = res.status;
      throw err;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      // stream:true 保证跨 chunk 截断的多字节汉字不会变乱码
      const piece = decoder.decode(value, { stream: true });
      if (!piece) continue;
      aiEl.classList.remove("waiting");
      consume(piece);
      chat.scrollTop = chat.scrollHeight;
    }
    const tail = decoder.decode();
    if (tail) consume(tail); // 冲刷解码器里残余的字节
    aiEl.classList.remove("waiting");

    if (cardRaw !== null) {
      try {
        const plan = parsePlanPayload(cardRaw.trim());
        if (!aiText) aiEl.parentElement.remove(); // 没有正文时只显示卡片
        addPlanCard(plan);
      } catch (err) {
        console.error("计划表解析失败", err, cardRaw);
        aiEl.textContent = (aiText ? aiText + "\n\n" : "") + "[计划表解析失败]";
        aiEl.classList.add("error");
      }
    } else {
      aiEl.textContent = aiText || "[后端返回了空内容]";
    }
  } catch (e) {
    // 主动中止（登出/切号/页面卸载）：不展示错误，气泡已随聊天区一起清掉
    if (e.name === "AbortError") return;
    aiEl.classList.remove("waiting");
    aiEl.classList.add("error");
    aiEl.textContent = (aiText ? aiText + "\n\n" : "") + "[请求失败] " + e.message;
    // 令牌过期/被顶下线：清本地状态，回登录界面
    if (e.status === 401) {
      logoutLocal();
      showAuthMsg("登录已过期，请重新登录", true);
    }
  } finally {
    if (inFlight === controller) inFlight = null;
    busy = false;
    sendBtn.disabled = !token;
    msgInput.focus();
  }
}

btnRegister.addEventListener("click", () => doAuth("register"));
btnLogin.addEventListener("click", () => doAuth("login"));
authPass.addEventListener("keydown", (e) => {
  if (e.key === "Enter") doAuth("login");
});
btnLogout.addEventListener("click", doLogout);
sendBtn.addEventListener("click", send);
msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

// 启动时恢复上次登录态（token 存在即视为已登录，失效了第一次请求会被 401 打回登录界面）
setAuthUI(!!(token && uid));
msgInput.focus();
</script>
</body>
</html>
